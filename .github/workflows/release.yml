name: Build and Release DwgSearcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Multi-File Release (Self-Contained Folder)
      run: |
        dotnet publish DwgSearcher.csproj -c Release -r win-x64 --self-contained true -o DwgSearcher-win-x64

    - name: Compress Release Archive
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "v1.0.18"
        }
        $zipName = "DwgSearcher-$version-win-x64.zip"
        Compress-Archive -Path DwgSearcher-win-x64 -DestinationPath $zipName
        Write-Output "Created zip archive: $zipName"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: DwgSearcher-*-win-x64.zip
        name: DwgSearcher ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
