name: Build and Release DwgSearcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Single-File Release
      run: |
        dotnet publish DwgSearcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish

    - name: Compress Release Archive
      shell: pwsh
      run: |
        Compress-Archive -Path publish\DwgSearcher.exe, README.md, app.ico -DestinationPath DwgSearcher-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: DwgSearcher-win-x64.zip
        name: DwgSearcher ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
